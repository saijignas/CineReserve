[pytest]

python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run
    race_condition: Tests for concurrent access patterns

asyncio_mode = auto

log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S




