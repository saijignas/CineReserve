version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: movie_reservation_db
    environment:
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: moviepass123
      POSTGRES_DB: movie_reservation
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieuser -d movie_reservation"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: movie_reservation_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: movie_reservation_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://movieuser:moviepass123@db:5432/movie_reservation
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-change-in-production-min-32-chars-long
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

